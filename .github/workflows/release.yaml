name: Release

# Builds the frontend, runs all tests and attaches iconhub.zip to the
# release. HACS installs that zip (zip_release in hacs.json), so the built
# JavaScript doesn't have to be committed.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: |
          pip install -r requirements_test.txt
          python -m pytest
          npm test

      - name: Set version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v' custom_components/iconhub/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/iconhub/manifest.json
          cat custom_components/iconhub/manifest.json

      - name: Create iconhub.zip
        run: |
          cd custom_components/iconhub
          test -f loader.js && test -f panel.js
          zip -r ../../iconhub.zip . -x "__pycache__/*" "*.pyc"
          cd ../..
          unzip -l iconhub.zip

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" iconhub.zip --clobber
